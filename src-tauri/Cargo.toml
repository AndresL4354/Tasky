[package]
name = "tasky"
version = "2.0.0"
description = "Gestor de tareas por proyecto con estética de editor de código"
authors = ["AndresL4354"]
edition = "2024"

[lib]
# El sufijo `_lib` evita choques de nombre entre lib y bin en Windows.
name = "tasky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

# Perfil de release pensado para un binario pequeño.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
