name: release

# Publica el .exe de Windows al empujar un tag de versión (p. ej. v0.1.0):
#   git tag v0.1.0 && git push origin v0.1.0
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release optimizado)
        run: cargo build --release

      - name: Empaquetar
        shell: pwsh
        run: Copy-Item target/release/tasky.exe "tasky-${{ github.ref_name }}.exe"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tasky-*.exe
          generate_release_notes: true
