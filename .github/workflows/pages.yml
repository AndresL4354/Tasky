name: pages

# Publica la app del celular (mobile/) en GitHub Pages: https://andresl4354.github.io/Tasky/
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/styles/**'
      - 'vite.mobile.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mobile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
